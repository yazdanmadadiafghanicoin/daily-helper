<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Daily Helper - ابزارهای روزمره">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">

  <title>Daily Helper</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Tahoma,
        sans-serif;
      background: #f4f6fa;
      color: #111827;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      min-height: 100vh;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .screen.active {
      display: block;
      animation: screenIn .2s ease;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateX(15px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* =========================
       HEADER
    ========================= */

    .top-header {
      background: #111827;
      color: white;
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        18px;
      border-radius: 0 0 24px 24px;
    }

    .header-row {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: white;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
    }

    .brand-subtitle {
      font-size: 11px;
      opacity: .65;
      margin-top: 3px;
    }

    /* =========================
       HOME
    ========================= */

    .home-content {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .welcome {
      margin-top: -2px;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 12px 30px rgba(37, 99, 235, .20);
    }

    .welcome small {
      opacity: .8;
    }

    .welcome h1 {
      margin: 8px 0;
      font-size: 27px;
    }

    .welcome p {
      margin: 0;
      opacity: .9;
      font-size: 14px;
    }

    .section-title {
      margin: 26px 3px 13px;
      font-size: 18px;
      font-weight: 800;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .quick-card {
      border: 0;
      background: white;
      border-radius: 20px;
      padding: 18px 14px;
      min-height: 125px;
      text-align: right;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .07);
      transition: transform .15s, box-shadow .15s;
    }

    .quick-card:active {
      transform: scale(.97);
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-size: 25px;
      background: #eef2ff;
      margin-bottom: 13px;
    }

    .quick-card h3 {
      margin: 0 0 5px;
      font-size: 15px;
      color: #111827;
    }

    .quick-card p {
      margin: 0;
      color: #6b7280;
      font-size: 11px;
    }

    /* =========================
       INTERNAL PAGE HEADER
    ========================= */

    .page-header {
      background: #111827;
      color: white;
      padding:
        calc(15px + env(safe-area-inset-top))
        15px
        15px;
      border-radius: 0 0 22px 22px;
    }

    .page-header-row {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-button {
      border: 0;
      background: rgba(255,255,255,.12);
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      font-size: 25px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 800;
    }

    .page-content {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    /* =========================
       CARDS
    ========================= */

    .app-card {
      background: white;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 5px 18px rgba(15,23,42,.07);
    }

    .input {
      width: 100%;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 14px;
      padding: 13px;
      outline: none;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .input:focus {
      border-color: #2563eb;
      background: white;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px;
      background: #2563eb;
      color: white;
      font-weight: 800;
      font-size: 14px;
    }

    .danger-btn {
      border: 0;
      border-radius: 10px;
      padding: 8px 11px;
      background: #fee2e2;
      color: #b91c1c;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .list-item:last-child {
      border-bottom: 0;
    }

    /* =========================
       CALCULATOR
    ========================= */

    .calculator {
      max-width: 430px;
      margin: auto;
      background: #111827;
      border-radius: 25px;
      padding: 15px;
      box-shadow: 0 15px 35px rgba(15,23,42,.18);
    }

    .calc-display {
      min-height: 115px;
      border-radius: 20px;
      background: #020617;
      color: white;
      padding: 20px 15px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      font-size: 42px;
      overflow: hidden;
      word-break: break-all;
      margin-bottom: 13px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .calc-btn {
      border: 0;
      height: 64px;
      border-radius: 17px;
      background: #374151;
      color: white;
      font-size: 20px;
      font-weight: 700;
    }

    .calc-btn:active {
      transform: scale(.95);
    }

    .calc-btn.operator {
      background: #2563eb;
    }

    .calc-btn.action {
      background: #6b7280;
    }

    .calc-btn.equal {
      background: #16a34a;
    }

    .calc-btn.zero {
      grid-column: span 2;
    }

    /* =========================
       MONEY
    ========================= */

    .money-summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .money-box {
      background: #f8fafc;
      border-radius: 17px;
      padding: 16px;
    }

    .money-box small {
      color: #6b7280;
    }

    .money-box strong {
      display: block;
      margin-top: 7px;
      font-size: 19px;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      z-index: 100;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(15px);
      border-top: 1px solid #e5e7eb;
      padding:
        8px
        10px
        calc(8px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
    }

    .nav-inner {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .nav-btn {
      border: 0;
      background: transparent;
      padding: 8px;
      color: #6b7280;
      border-radius: 13px;
      font-size: 12px;
    }

    .nav-btn.active {
      background: #eef2ff;
      color: #2563eb;
      font-weight: 800;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 2px;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 700px) {
      .tools-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .screen {
        padding-bottom: 30px;
      }

      .bottom-nav {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       HOME SCREEN
  ========================= -->

  <section id="homeScreen" class="screen active">

    <header class="top-header">
      <div class="header-row">

        <div class="brand">
          <div class="brand-icon">
            <img src="./icon.svg" alt="Daily Helper">
          </div>

          <div>
            <div class="brand-title">Daily Helper</div>
            <div class="brand-subtitle">
              ابزارهای روزمره در یک برنامه
            </div>
          </div>
        </div>

      </div>
    </header>

    <main class="home-content">

      <section class="welcome">
        <small>خوش آمدید 👋</small>
        <h1>امروز چه کاری داری؟</h1>
        <p>
          ابزار مورد نیازت را انتخاب کن.
        </p>
      </section>

      <div class="section-title">
        ابزارهای من
      </div>

      <div class="tools-grid">

        <button class="quick-card"
          onclick="showScreen('calculator')">
          <div class="tool-icon">🧮</div>
          <h3>ماشین‌حساب</h3>
          <p>محاسبه سریع</p>
        </button>

        <button class="quick-card"
          onclick="showScreen('todo')">
          <div class="tool-icon">✅</div>
          <h3>کارهای من</h3>
          <p>لیست کارهای روزانه</p>
        </button>

        <button class="quick-card"
          onclick="showScreen('money')">
          <div class="tool-icon">💰</div>
          <h3>مدیریت پول</h3>
          <p>درآمد و هزینه</p>
        </button>

        <button class="quick-card"
          onclick="showScreen('notes')">
          <div class="tool-icon">📝</div>
          <h3>یادداشت‌ها</h3>
          <p>یادداشت سریع</p>
        </button>

        <button class="quick-card"
          onclick="showScreen('shopping')">
          <div class="tool-icon">🛒</div>
          <h3>لیست خرید</h3>
          <p>خریدهای امروز</p>
        </button>

        <button class="quick-card"
          onclick="showScreen('reminder')">
          <div class="tool-icon">⏰</div>
          <h3>یادآور</h3>
          <p>یادآوری کارها</p>
        </button>

      </div>

    </main>

  </section>


  <!-- =========================
       CALCULATOR SCREEN
  ========================= -->

  <section id="calculatorScreen" class="screen">

    <header class="page-header">
      <div class="page-header-row">

        <button class="back-button"
          onclick="goHome()">←</button>

        <div class="page-title">
          🧮 ماشین‌حساب
        </div>

      </div>
    </header>

    <main class="page-content">

      <div class="calculator">

        <div id="calcDisplay" class="calc-display">
          0
        </div>

        <div class="calc-grid">

          <button class="calc-btn action"
            onclick="calcClear()">AC</button>

          <button class="calc-btn action"
            onclick="calcBackspace()">⌫</button>

          <button class="calc-btn action"
            onclick="calcPercent()">%</button>

          <button class="calc-btn operator"
            onclick="calcOperator('/')">÷</button>

          <button class="calc-btn"
            onclick="calcNumber('7')">7</button>

          <button class="calc-btn"
            onclick="calcNumber('8')">8</button>

          <button class="calc-btn"
            onclick="calcNumber('9')">9</button>

          <button class="calc-btn operator"
            onclick="calcOperator('*')">×</button>

          <button class="calc-btn"
            onclick="calcNumber('4')">4</button>

          <button class="calc-btn"
            onclick="calcNumber('5')">5</button>

          <button class="calc-btn"
            onclick="calcNumber('6')">6</button>

          <button class="calc-btn operator"
            onclick="calcOperator('-')">−</button>

          <button class="calc-btn"
            onclick="calcNumber('1')">1</button>

          <button class="calc-btn"
            onclick="calcNumber('2')">2</button>

          <button class="calc-btn"
            onclick="calcNumber('3')">3</button>

          <button class="calc-btn operator"
            onclick="calcOperator('+')">+</button>

          <button class="calc-btn zero"
            onclick="calcNumber('0')">0</button>

          <button class="calc-btn"
            onclick="calcDecimal()">.</button>

          <button class="calc-btn equal"
            onclick="calcEquals()">=</button>

        </div>

      </div>

    </main>

  </section>


  <!-- =========================
       TODO SCREEN
  ========================= -->

  <section id="todoScreen" class="screen">

    <header class="page-header">
      <div class="page-header-row">
        <button class="back-button" onclick="goHome()">←</button>
        <div class="page-title">✅ کارهای من</div>
      </div>
    </header>

    <main class="page-content">

      <div class="app-card">

        <input
          id="todoInput"
          class="input"
          placeholder="کار جدید را بنویس..."
        >

        <button class="primary-btn"
          onclick="addTodo()">
          افزودن کار
        </button>

      </div>

      <div class="app-card">
        <div id="todoList"></div>
      </div>

    </main>

  </section>


  <!-- =========================
       MONEY SCREEN
  ========================= -->

  <section id="moneyScreen" class="screen">

    <header class="page-header">
      <div class="page-header-row">
        <button class="back-button" onclick="goHome()">←</button>
        <div class="page-title">💰 مدیریت پول</div>
      </div>
    </header>

    <main class="page-content">

      <div class="money-summary">

        <div class="money-box">
          <small>درآمد</small>
          <strong id="incomeTotal">0</strong>
        </div>

        <div class="money-box">
          <small>هزینه</small>
          <strong id="expenseTotal">0</strong>
        </div>

      </div>

      <div class="app-card">

        <input
          id="moneyAmount"
          class="input"
          type="number"
          placeholder="مبلغ"
        >

        <select id="moneyType" class="input">
          <option value="income">درآمد</option>
          <option value="expense">هزینه</option>
        </select>

        <input
          id="moneyDescription"
          class="input"
          placeholder="توضیح"
        >

        <button class="primary-btn"
          onclick="addMoney()">
          ثبت
        </button>

      </div>

      <div class="app-card">
        <div id="moneyList"></div>
      </div>

    </main>

  </section>


  <!-- =========================
       NOTES SCREEN
  ========================= -->

  <section id="notesScreen" class="screen">

    <header class="page-header">
      <div class="page-header-row">
        <button class="back-button" onclick="goHome()">←</button>
        <div class="page-title">📝 یادداشت‌ها</div>
      </div>
    </header>

    <main class="page-content">

      <div class="app-card">

        <textarea
          id="noteInput"
          class="input"
          rows="7"
          placeholder="یادداشت خود را بنویس..."
        ></textarea>

        <button class="primary-btn"
          onclick="saveNote()">
          ذخیره یادداشت
        </button>

      </div>

      <div class="app-card">
        <div id="notesList"></div>
      </div>

    </main>

  </section>


  <!-- =========================
       SHOPPING SCREEN
  ========================= -->

  <section id="shoppingScreen" class="screen">

    <header class="page-header">
      <div class="page-header-row">
        <button class="back-button" onclick="goHome()">←</button>
        <div class="page-title">🛒 لیست خرید</div>
      </div>
    </header>

    <main class="page-content">

      <div class="app-card">

        <input
          id="shoppingInput"
          class="input"
          placeholder="مثلاً نان، شیر، برنج..."
        >

        <button class="primary-btn"
          onclick="addShopping()">
          افزودن به لیست
        </button>

      </div>

      <div class="app-card">
        <div id="shoppingList"></div>
      </div>

    </main>

  </section>


  <!-- =========================
       REMINDER SCREEN
  ========================= -->

  <section id="reminderScreen" class="screen">

    <header class="page-header">
      <div class="page-header-row">
        <button class="back-button" onclick="goHome()">←</button>
        <div class="page-title">⏰ یادآور</div>
      </div>
    </header>

    <main class="page-content">

      <div class="app-card">

        <input
          id="reminderInput"
          class="input"
          placeholder="چه چیزی را یادآوری کنم؟"
        >

        <input
          id="reminderTime"
          class="input"
          type="datetime-local"
        >

        <button class="primary-btn"
          onclick="addReminder()">
          افزودن یادآور
        </button>

      </div>

      <div class="app-card">
        <div id="reminderList"></div>
      </div>

    </main>

  </section>


  <!-- =========================
       BOTTOM NAV
  ========================= -->

  <nav class="bottom-nav">

    <div class="nav-inner">

      <button
        id="homeNav"
        class="nav-btn active"
        onclick="goHome()">

        <span class="nav-icon">🏠</span>
        خانه

      </button>

      <button
        class="nav-btn"
        onclick="showScreen('calculator')">

        <span class="nav-icon">🧮</span>
        ماشین‌حساب

      </button>

    </div>

  </nav>

</div>


<script>

  /* =====================================================
     SCREEN NAVIGATION
  ===================================================== */

  const screenNames = [
    "home",
    "calculator",
    "todo",
    "money",
    "notes",
    "shopping",
    "reminder"
  ];

  function showScreen(name, addHistory = true) {

    screenNames.forEach(screen => {

      const element =
        document.getElementById(screen + "Screen");

      if (element) {
        element.classList.remove("active");
      }

    });

    const selected =
      document.getElementById(name + "Screen");

    if (!selected) return;

    selected.classList.add("active");

    window.scrollTo({
      top: 0,
      behavior: "instant"
    });

    if (addHistory && name !== "home") {
      history.pushState(
        { screen: name },
        "",
        "#" + name
      );
    }

    updateNavigation(name);

    if (name === "todo") renderTodos();
    if (name === "money") renderMoney();
    if (name === "notes") renderNotes();
    if (name === "shopping") renderShopping();
    if (name === "reminder") renderReminders();
  }


  function goHome() {

    history.replaceState(
      { screen: "home" },
      "",
      location.pathname
    );

    showScreen("home", false);

  }


  function updateNavigation(name) {

    const homeNav =
      document.getElementById("homeNav");

    if (homeNav) {
      homeNav.classList.toggle(
        "active",
        name === "home"
      );
    }

  }


  window.addEventListener("popstate", function() {

    if (location.hash) {

      const name =
        location.hash.substring(1);

      if (screenNames.includes(name)) {
        showScreen(name, false);
        return;
      }

    }

    showScreen("home", false);

  });


  /* =====================================================
     CALCULATOR
  ===================================================== */

  let calcCurrent = "0";
  let calcPrevious = null;
  let calcOperatorValue = null;
  let calcWaiting = false;


  function updateCalc() {

    const display =
      document.getElementById("calcDisplay");

    if (display) {
      display.textContent = calcCurrent;
    }

  }


  function calcNumber(number) {

    if (
      calcCurrent === "0" ||
      calcWaiting
    ) {
      calcCurrent = number;
      calcWaiting = false;
    } else {
      calcCurrent += number;
    }

    updateCalc();
  }


  function calcDecimal() {

    if (calcWaiting) {
      calcCurrent = "0.";
      calcWaiting = false;
      updateCalc();
      return;
    }

    if (!calcCurrent.includes(".")) {
      calcCurrent += ".";
    }

    updateCalc();
  }


  function calcOperator(operator) {

    const inputValue =
      parseFloat(calcCurrent);

    if (calcOperatorValue && calcWaiting) {
      calcOperatorValue = operator;
      return;
    }

    if (calcPrevious === null) {
      calcPrevious = inputValue;
    } else if (calcOperatorValue) {

      const result =
        calculateOperation(
          calcPrevious,
          inputValue,
          calcOperatorValue
        );

      calcCurrent = String(
        roundResult(result)
      );

      calcPrevious = parseFloat(calcCurrent);

      updateCalc();
    }

    calcWaiting = true;
    calcOperatorValue = operator;
  }


  function calculateOperation(a, b, operator) {

    switch (operator) {

      case "+":
        return a + b;

      case "-":
        return a - b;

      case "*":
        return a * b;

      case "/":
        return b === 0
          ? 0
          : a / b;

      default:
        return b;
    }

  }


  function calcEquals() {

    if (
      calcOperatorValue === null ||
      calcPrevious === null
    ) {
      return;
    }

    const inputValue =
      parseFloat(calcCurrent);

    const result =
      calculateOperation(
        calcPrevious,
        inputValue,
        calcOperatorValue
      );

    calcCurrent =
      String(roundResult(result));

    calcPrevious = null;
    calcOperatorValue = null;
    calcWaiting = true;

    updateCalc();
  }


  function calcPercent() {

    const value =
      parseFloat(calcCurrent);

    calcCurrent =
      String(roundResult(value / 100));

    updateCalc();
  }


  function calcClear() {

    calcCurrent = "0";
    calcPrevious = null;
    calcOperatorValue = null;
    calcWaiting = false;

    updateCalc();
  }


  function calcBackspace() {

    if (
      calcCurrent.length <= 1 ||
      calcCurrent === "Error"
    ) {
      calcCurrent = "0";
    } else {
      calcCurrent =
        calcCurrent.slice(0, -1);
    }

    updateCalc();
  }


  function roundResult(number) {

    return Math.round(
      (number + Number.EPSILON) * 100000000
    ) / 100000000;

  }


  document.addEventListener(
    "keydown",
    function(event) {

      if (
        !document
          .getElementById("calculatorScreen")
          .classList.contains("active")
      ) {
        return;
      }

      if (/^[0-9]$/.test(event.key)) {
        calcNumber(event.key);
      }

      if (event.key === ".") {
        calcDecimal();
      }

      if (
        ["+", "-", "*", "/"].includes(event.key)
      ) {
        calcOperator(event.key);
      }

      if (event.key === "Enter" || event.key === "=") {
        calcEquals();
      }

      if (event.key === "Escape") {
        calcClear();
      }

      if (event.key === "Backspace") {
        calcBackspace();
      }

    }
  );


  /* =====================================================
     TODO
  ===================================================== */

  let todos =
    JSON.parse(
      localStorage.getItem(
        "daily_helper_todos"
      ) || "[]"
    );


  function addTodo() {

    const input =
      document.getElementById("todoInput");

    const text =
      input.value.trim();

    if (!text) return;

    todos.push({
      id: Date.now(),
      text: text,
      done: false
    });

    saveTodos();

    input.value = "";

    renderTodos();
  }


  function saveTodos() {

    localStorage.setItem(
      "daily_helper_todos",
      JSON.stringify(todos)
    );

  }


  function toggleTodo(id) {

    todos =
      todos.map(todo =>
        todo.id === id
          ? {...todo, done: !todo.done}
          : todo
      );

    saveTodos();
    renderTodos();
  }


  function deleteTodo(id) {

    todos =
      todos.filter(
        todo => todo.id !== id
      );

    saveTodos();
    renderTodos();
  }


  function renderTodos() {

    const list =
      document.getElementById("todoList");

    if (!todos.length) {

      list.innerHTML =
        "<p style='color:#6b7280;text-align:center'>هنوز کاری ثبت نشده.</p>";

      return;
    }

    list.innerHTML =
      todos.map(todo => `

        <div class="list-item">

          <label style="display:flex;align-items:center;gap:10px;flex:1">

            <input
              type="checkbox"
              ${todo.done ? "checked" : ""}
              onchange="toggleTodo(${todo.id})"
            >

            <span style="
              ${todo.done
                ? "text-decoration:line-through;color:#9ca3af"
                : ""}
            ">
              ${escapeHTML(todo.text)}
            </span>

          </label>

          <button
            class="danger-btn"
            onclick="deleteTodo(${todo.id})">
            حذف
          </button>

        </div>

      `).join("");

  }


  /* =====================================================
     MONEY
  ===================================================== */

  let transactions =
    JSON.parse(
      localStorage.getItem(
        "daily_helper_transactions"
      ) || "[]"
    );


  function addMoney() {

    const amount =
      parseFloat(
        document.getElementById(
          "moneyAmount"
        ).value
      );

    const type =
      document.getElementById(
        "moneyType"
      ).value;

    const description =
      document.getElementById(
        "moneyDescription"
      ).value.trim();

    if (!amount || amount <= 0) {
      alert("مبلغ را وارد کنید.");
      return;
    }

    transactions.push({
      id: Date.now(),
      amount: amount,
      type: type,
      description:
        description || "بدون توضیح",
      date: new Date().toLocaleDateString("fa-AF")
    });

    localStorage.setItem(
      "daily_helper_transactions",
      JSON.stringify(transactions)
    );

    document.getElementById(
      "moneyAmount"
    ).value = "";

    document.getElementById(
      "moneyDescription"
    ).value = "";

    renderMoney();
  }


  function deleteMoney(id) {

    transactions =
      transactions.filter(
        item => item.id !== id
      );

    localStorage.setItem(
      "daily_helper_transactions",
      JSON.stringify(transactions)
    );

    renderMoney();
  }


  function renderMoney() {

    let income = 0;
    let expense = 0;

    transactions.forEach(item => {

      if (item.type === "income") {
        income += item.amount;
      } else {
        expense += item.amount;
      }

    });

    document.getElementById(
      "incomeTotal"
    ).textContent =
      formatNumber(income);

    document.getElementById(
      "expenseTotal"
    ).textContent =
      formatNumber(expense);

    const list =
      document.getElementById("moneyList");

    if (!transactions.length) {

      list.innerHTML =
        "<p style='color:#6b7280;text-align:center'>هنوز تراکنشی ثبت نشده.</p>";

      return;
    }

    list.innerHTML =
      transactions.slice().reverse().map(item => `

        <div class="list-item">

          <div>

            <strong>
              ${escapeHTML(item.description)}
            </strong>

            <div style="font-size:11px;color:#9ca3af;margin-top:4px">
              ${item.date}
            </div>

          </div>

          <div style="text-align:left">

            <strong style="
              color:${item.type === "income"
                ? "#16a34a"
                : "#dc2626"}
            ">
              ${item.type === "income" ? "+" : "-"}
              ${formatNumber(item.amount)}
            </strong>

            <br>

            <button
              class="danger-btn"
              onclick="deleteMoney(${item.id})">
              حذف
            </button>

          </div>

        </div>

      `).join("");

  }


  /* =====================================================
     NOTES
  ===================================================== */

  let notes =
    JSON.parse(
      localStorage.getItem(
        "daily_helper_notes"
      ) || "[]"
    );


  function saveNote() {

    const input =
      document.getElementById("noteInput");

    const text =
      input.value.trim();

    if (!text) return;

    notes.push({
      id: Date.now(),
      text: text,
      date:
        new Date().toLocaleString("fa-AF")
    });

    localStorage.setItem(
      "daily_helper_notes",
      JSON.stringify(notes)
    );

    input.value = "";

    renderNotes();
  }


  function deleteNote(id) {

    notes =
      notes.filter(
        note => note.id !== id
      );

    localStorage.setItem(
      "daily_helper_notes",
      JSON.stringify(notes)
    );

    renderNotes();
  }


  function renderNotes() {

    const list =
      document.getElementById("notesList");

    if (!notes.length) {

      list.innerHTML =
        "<p style='color:#6b7280;text-align:center'>هنوز یادداشتی وجود ندارد.</p>";

      return;
    }

    list.innerHTML =
      notes.slice().reverse().map(note => `

        <div class="list-item">

          <div style="flex:1">

            <div style="white-space:pre-wrap">
              ${escapeHTML(note.text)}
            </div>

            <div style="
              color:#9ca3af;
              font-size:10px;
              margin-top:7px;
            ">
              ${note.date}
            </div>

          </div>

          <button
            class="danger-btn"
            onclick="deleteNote(${note.id})">
            حذف
          </button>

        </div>

      `).join("");

  }


  /* =====================================================
     SHOPPING
  ===================================================== */

  let shopping =
    JSON.parse(
      localStorage.getItem(
        "daily_helper_shopping"
      ) || "[]"
    );


  function addShopping() {

    const input =
      document.getElementById(
        "shoppingInput"
      );

    const text =
      input.value.trim();

    if (!text) return;

    shopping.push({
      id: Date.now(),
      text: text,
      checked: false
    });

    localStorage.setItem(
      "daily_helper_shopping",
      JSON.stringify(shopping)
    );

    input.value = "";

    renderShopping();
  }


  function toggleShopping(id) {

    shopping =
      shopping.map(item =>
        item.id === id
          ? {...item, checked: !item.checked}
          : item
      );

    localStorage.setItem(
      "daily_helper_shopping",
      JSON.stringify(shopping)
    );

    renderShopping();
  }


  function deleteShopping(id) {

    shopping =
      shopping.filter(
        item => item.id !== id
      );

    localStorage.setItem(
      "daily_helper_shopping",
      JSON.stringify(shopping)
    );

    renderShopping();
  }


  function renderShopping() {

    const list =
      document.getElementById(
        "shoppingList"
      );

    if (!shopping.length) {

      list.innerHTML =
        "<p style='color:#6b7280;text-align:center'>لیست خرید خالی است.</p>";

      return;
    }

    list.innerHTML =
      shopping.map(item => `

        <div class="list-item">

          <label style="
            display:flex;
            align-items:center;
            gap:10px;
            flex:1;
          ">

            <input
              type="checkbox"
              ${item.checked ? "checked" : ""}
              onchange="toggleShopping(${item.id})"
            >

            <span style="
              ${item.checked
                ? "text-decoration:line-through;color:#9ca3af"
                : ""}
            ">
              ${escapeHTML(item.text)}
            </span>

          </label>

          <button
            class="danger-btn"
            onclick="deleteShopping(${item.id})">
            حذف
          </button>

        </div>

      `).join("");

  }


  /* =====================================================
     REMINDERS
  ===================================================== */

  let reminders =
    JSON.parse(
      localStorage.getItem(
        "daily_helper_reminders"
      ) || "[]"
    );


  function addReminder() {

    const text =
      document.getElementById(
        "reminderInput"
      ).value.trim();

    const time =
      document.getElementById(
        "reminderTime"
      ).value;

    if (!text || !time) {

      alert("متن و زمان یادآور را وارد کنید.");

      return;
    }

    reminders.push({
      id: Date.now(),
      text: text,
      time: time
    });

    localStorage.setItem(
      "daily_helper_reminders",
      JSON.stringify(reminders)
    );

    document.getElementById(
      "reminderInput"
    ).value = "";

    document.getElementById(
      "reminderTime"
    ).value = "";

    renderReminders();
  }


  function deleteReminder(id) {

    reminders =
      reminders.filter(
        item => item.id !== id
      );

    localStorage.setItem(
      "daily_helper_reminders",
      JSON.stringify(reminders)
    );

    renderReminders();
  }


  function renderReminders() {

    const list =
      document.getElementById(
        "reminderList"
      );

    if (!reminders.length) {

      list.innerHTML =
        "<p style='color:#6b7280;text-align:center'>هنوز یادآوری ثبت نشده.</p>";

      return;
    }

    list.innerHTML =
      reminders.slice().reverse().map(item => `

        <div class="list-item">

          <div>

            <strong>
              ${escapeHTML(item.text)}
            </strong>

            <div style="
              color:#6b7280;
              font-size:12px;
              margin-top:5px;
            ">
              ${formatDateTime(item.time)}
            </div>

          </div>

          <button
            class="danger-btn"
            onclick="deleteReminder(${item.id})">
            حذف
          </button>

        </div>

      `).join("");

  }


  /* =====================================================
     HELPERS
  ===================================================== */

  function formatNumber(number) {

    return Number(number).toLocaleString("fa-AF");

  }


  function formatDateTime(value) {

    try {

      return new Date(value)
        .toLocaleString("fa-AF");

    } catch {

      return value;

    }

  }


  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =====================================================
     PWA
  ===================================================== */

  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      function() {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(error =>
            console.log(
              "Service Worker:",
              error
            )
          );

      }
    );

  }


  /* =====================================================
     STARTUP
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      renderTodos();
      renderMoney();
      renderNotes();
      renderShopping();
      renderReminders();
      updateCalc();

      if (location.hash) {

        const name =
          location.hash.substring(1);

        if (screenNames.includes(name)) {
          showScreen(name, false);
        }

      }

    }
  );

</script>
